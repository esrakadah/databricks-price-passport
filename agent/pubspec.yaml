version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  genkit: ^1.0.1
  genkit_google_genai: ^1.0.1
  genkit_mcp: ^1.0.1
  genkit_shelf: ^1.0.1
  http: ^1.4.0
  logging: ^1.3.0
  schemantic: ^1.0.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5

dev_dependencies:
  build_runner: ^2.10.5
  schemantic_builder: ^1.0.0
  test: ^1.33.0
  very_good_analysis: ^10.3.0
