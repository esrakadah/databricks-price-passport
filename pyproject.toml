[project]
name = "price-passport"
version = "0.1.0"
description = "Hourly energy prices from a versioned model, with a passport for every price."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Esra Kadah" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.2", "ruff>=0.17.3,<0.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_passport"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "DTZ", "PT"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
