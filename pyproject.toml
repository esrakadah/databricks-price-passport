[project]
name = "price-passport"
version = "0.1.0"
description = "Hourly energy prices from a versioned model, with a passport for every price."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Esra Kadah" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
price-passport-ingest = "price_passport.ingest:main"
price-passport-features = "price_passport.features:main"
price-passport-train = "price_passport.training:main"
price-passport-gate = "price_passport.gate:main"

[dependency-groups]
dev = [
    "mlflow-skinny==2.22.0",
    "mypy>=2.4",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pytest>=9.2",
    "ruff>=0.17.3,<0.18",
    "scikit-learn==1.6.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_passport"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "DTZ", "PT"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "pandas.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
