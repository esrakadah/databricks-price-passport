bundle:
  name: price-passport

variables:
  schema:
    description: Schema in the `workspace` catalog that holds this target's volumes and tables.
  schedule_pause_status:
    description: Whether this target's schedules run.
    default: PAUSED

artifacts:
  wheel:
    type: whl
    build: uv build --wheel
    path: .

resources:
  schemas:
    price_passport:
      catalog_name: workspace
      name: ${var.schema}
      comment: Price Passport raw data, features and prices.

  volumes:
    raw:
      catalog_name: workspace
      schema_name: ${resources.schemas.price_passport.name}
      name: raw
      volume_type: MANAGED
      comment: Unchanged API responses, one file per source, site and delivery day.

  experiments:
    training:
      name: /Users/${workspace.current_user.userName}/price-passport-${var.schema}

  pipelines:
    silver:
      name: price-passport-silver
      catalog: workspace
      schema: ${resources.schemas.price_passport.name}
      serverless: true
      channel: CURRENT
      configuration:
        raw_root: /Volumes/workspace/${resources.schemas.price_passport.name}/raw
        spark.sql.session.timeZone: UTC
      libraries:
        - file:
            path: ./pipelines/raw_to_silver.sql

  jobs:
    ingest:
      name: price-passport-ingest
      description: Fetches day-ahead prices and archived weather forecasts into the raw volume (decisions section 3).
      schedule:
        quartz_cron_expression: "0 40 13,16 * * ?"
        timezone_id: Europe/Berlin
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: ingest
          environment_key: default
          python_wheel_task:
            package_name: price_passport
            entry_point: price-passport-ingest
            parameters:
              - --volume-root
              - /Volumes/workspace/${resources.schemas.price_passport.name}/raw
        - task_key: refresh_silver
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver.id}
        - task_key: build_features
          depends_on:
            - task_key: refresh_silver
          environment_key: default
          python_wheel_task:
            package_name: price_passport
            entry_point: price-passport-features
            parameters:
              - --catalog
              - workspace
              - --schema
              - ${resources.schemas.price_passport.name}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl

    train:
      name: price-passport-train
      description: Trains one model on the current gold features and registers it in Unity Catalog (decisions section 8).
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: model
          default: gradient_boosting
      tasks:
        - task_key: train
          environment_key: default
          python_wheel_task:
            package_name: price_passport
            entry_point: price-passport-train
            parameters:
              - --catalog
              - workspace
              - --schema
              - ${resources.schemas.price_passport.name}
              - --model
              - "{{job.parameters.model}}"
              - --experiment-id
              - ${resources.experiments.training.id}
              - --git-commit
              - ${bundle.git.commit}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: price_passport_dev

  prod:
    mode: production
    variables:
      schema: price_passport
      schedule_pause_status: UNPAUSED
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
